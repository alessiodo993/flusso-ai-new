<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flusso — senza rete</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf8f4;
        --ink: #1d2b22;
        --soft: #5d6b63;
        --accent: #3f6b4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171a;
          --ink: #e8eae9;
          --soft: #9aa5a0;
          --accent: #6f9d7e;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .dot {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 999px;
        background: var(--accent);
        margin: 0 auto 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
        font-weight: 500;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--soft);
        max-width: 30rem;
        line-height: 1.6;
      }
      button {
        font: inherit;
        padding: 0.6rem 1.2rem;
        border-radius: 0.6rem;
        border: none;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"></div>
      <h1>Flusso è senza rete</h1>
      <p>
        Il calendario vive sul server: mostrartelo com'era mezz'ora fa sarebbe
        peggio che non mostrartelo. Appena torni online riprende da dov'eri.
      </p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
